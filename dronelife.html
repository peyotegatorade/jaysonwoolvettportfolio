<!DOCTYPE html>
<html>
    <link rel="stylesheet" type="text/css" href="style.css">

<head>
    <title>jayson woolvett, writer&amp;animator</title>
    <link rel="icon" type="image/svg" href="favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <style>
        .columns {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;

        }

        .left-column {
        flex: 1;
        max-width: 50%;
        }

        .left-column img {
        display: block;
        margin-bottom: 10px;
        max-width: 100%;
        height: auto;
        }

        .right-column {
        flex: 3;
        max-width: 53%;
        }

        .right-column img {
        display: block;
        max-width: 100%;
        height: auto;
        }
        @media screen and (max-width: 767px) {
        .columns {
        display: flex;
        flex-direction: column;
        }
        .right-column {
        flex: 3;
        max-width: 100%;
        }
        .left-column {
        flex: 1;
        max-width: 100%;
        }
        }
    </style>
    <header>
      <script>
        fetch("header.html")
          .then(response => response.text())
          .then(data => document.querySelector("header").innerHTML = data);
      </script>
   
	  </header>
    <main>
      <div class="hero">
        <div style="padding:56.25% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/293828536?h=e77d6f00b5&color=ffffff&title=0&byline=0&portrait=0" style="position:absolute;top:0;left:0;width:100%;height:100%;" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div><script src="https://player.vimeo.com/api/player.js"></script>
      </div>
      <div class="container">
          <br><b>DRONE Life 1.0</b>
          <br>A one minute loop intended for projections on buildings along with wheatpasted posters in a 10 mile radius, expanding out from projection sites like spider webs.
          <br>
          <br>☆Official Selection - Nuit Blanche Saskatoon 2018☆
          <br>
          <br><i>Credits:
          <br>Design - Monique Motut-Firth
          <br>Animation - Jayson Woolvett</i>
      </div> 
      <div class="line"></div>
      <div class="columns">
          <div class="left-column">
              <img src="images\drone01.jpg">
              <img src="images\drone02.jpg">

          </div>
          <div class="right-column">
            <img src="images\drone03.jpg">  
          </div>
      </div>

    </main>
</body>
</html>
